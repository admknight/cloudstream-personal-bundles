name: Import verified Personal Bundle Builder
on:
  push:
    branches: [main]
    paths: ['cloudstream-personal-bundle-builder.zip']

permissions:
  contents: write

concurrency:
  group: import-personal-bundles
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify ZIP integrity and extract only authorized project files
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path('cloudstream-personal-bundle-builder.zip')
          expected = '857b071758da77178b5c57ffa483a9de216249382f02e02f4b3acba790c4d147'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('Archive SHA-256 mismatch; refusing import')

          allowed = {
              'README.md', 'DEPLOYMENT.md', 'package.json', 'wrangler.toml',
              '.gitignore', '.github/workflows/test.yml',
              'src/selection.js', 'src/worker.js', 'src/ui.js', 'src/catalog.js',
              'test/browser-check.py', 'test/worker.test.js',
              'test/mock-server.mjs', 'test/selection.test.js',
          }
          with ZipFile(archive) as z:
              files = {entry.filename for entry in z.infolist() if not entry.is_dir()}
              if files != allowed:
                  raise SystemExit('Unexpected archive members; refusing import')
              for name in sorted(files):
                  target = Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(name))
          print('Archive checksum verified; restored all 14 project files.')
          PY

      - name: Verify bundle-builder unit and compatibility tests
        run: npm test

      - name: Publish tested source and remove transfer archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md DEPLOYMENT.md package.json wrangler.toml .gitignore
          git add -- .github/workflows/test.yml src/ test/
          git rm -- cloudstream-personal-bundle-builder.zip
          git commit -m 'feat: publish verified Personal Bundle Builder source'
          git push origin HEAD:main
